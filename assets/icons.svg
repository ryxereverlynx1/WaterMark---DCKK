<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Brand Emblem -->
    <g id="icon-diamond">
      <polygon points="6 3 18 3 22 9 12 22 2 9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="22" x2="12" y2="9" stroke="currentColor" stroke-width="1.75"/>
      <line x1="2" y1="9" x2="22" y2="9" stroke="currentColor" stroke-width="1.75"/>
      <line x1="6" y1="3" x2="10" y2="9" stroke="currentColor" stroke-width="1.75"/>
      <line x1="18" y1="3" x2="14" y2="9" stroke="currentColor" stroke-width="1.75"/>
    </g>

    <!-- Shield / Privacy -->
    <g id="icon-shield">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Upload Image -->
    <g id="icon-upload">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="8.5" cy="8.5" r="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <polyline points="21 15 16 10 5 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Download -->
    <g id="icon-download">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="7 10 12 15 17 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
</svg>
